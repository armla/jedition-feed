name: Generate and publish JamesEdition feed

on:
  schedule:
    # Costa Rica is UTC−6 throughout the year: 22:58 local = 04:58 UTC the following calendar day.
    - cron: "58 4 * * *"
  workflow_dispatch:
    inputs:
      activity_mode:
        description: "Activity delivery: off (default), test (one MLS ID), or live (first-publication events)"
        required: false
        default: "off"
        type: choice
        options:
          - "off"
          - "test"
          - "live"
      activity_test_reference:
        description: "MLS ID used only when activity_mode is test"
        required: false
        default: ""
        type: string

# Source code remains protected on main. The job may only update the dedicated live-output branch.
permissions:
  contents: write

concurrency:
  group: jamesedition-feed-publish
  cancel-in-progress: false

jobs:
  generate:
    name: Generate, validate, and publish feed
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out protected feed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: source
          fetch-depth: 1

      - name: Check out public live-output branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: jamesedition-live
          path: publication
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Load persistent feed state
        run: |
          set -euo pipefail
          mkdir -p publication/.state publication/public/feeds
          for name in feed_token.txt enrichment_cache.json; do
            if [ ! -s "publication/.state/${name}" ]; then
              cp "source/.state/${name}" "publication/.state/${name}"
            fi
          done
          test -s publication/.state/feed_token.txt

      - name: Generate and validate the JamesEdition XML
        env:
          # Dedicated Zapier Catch Hook. The URL is held only in GitHub Actions Secrets.
          JAMESEDITION_PUBLISH_WEBHOOK_URL: ${{ secrets.JAMESEDITION_PUBLISH_WEBHOOK_URL }}
          ACTIVITY_MODE: ${{ inputs.activity_mode || 'off' }}
          ACTIVITY_TEST_REFERENCE: ${{ inputs.activity_test_reference || '' }}
        run: |
          set -euo pipefail
          TOKEN="$(cat publication/.state/feed_token.txt)"
          export JAMESEDITION_FEED_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/jamesedition-live/public/feeds/${TOKEN}.xml"
          python3 source/generate_jamesedition_feed.py \
            --output "publication/public/feeds/${TOKEN}.xml" \
            --state "publication/.state/feed_state.json" \
            --cache "publication/.state/enrichment_cache.json" \
            --activity-state "publication/.state/jamesedition_publication_activity_state.json" \
            --activity-mode "$ACTIVITY_MODE" \
            --activity-test-reference "$ACTIVITY_TEST_REFERENCE"

      - name: Validate the publication payload
        run: |
          set -euo pipefail
          TOKEN="$(cat publication/.state/feed_token.txt)"
          test -s "publication/public/feeds/${TOKEN}.xml"
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          token = Path('publication/.state/feed_token.txt').read_text().strip()
          xml = Path(f'publication/public/feeds/{token}.xml').read_bytes()
          root = ET.fromstring(xml)
          assert root.tag == 'jamesedition_feed'
          adverts = root.findall('./adverts/advert')
          assert len(adverts) == 50
          assert len({item.attrib['reference'] for item in adverts}) == 50
          assert all(len(item.findall('./media/image')) >= 2 for item in adverts)
          assert all(len(item.findall('./media/image')) <= 12 for item in adverts)
          PY

      - name: Publish only validated live-output changes
        run: |
          set -euo pipefail
          cd publication
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/ .state/
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh JamesEdition feed"
            git push origin HEAD:jamesedition-live
          fi
